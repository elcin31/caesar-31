name: Reader edition 1.2.1

on:
  push:
    branches:
      - edition-1.2.1
    paths:
      - manuscript/**
      - scripts/**
      - .github/workflows/reader-edition-121.yml
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install book publishing tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-lang-cyrillic texlive-latex-extra texlive-latex-recommended \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils \
            default-jre-headless unzip curl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check reader-facing manuscript
        run: python scripts/audit_clean_reader_121.py --sources-only
      - name: Assemble EPUB DOCX PDF
        run: |
          if ! python scripts/build.py --version 1.2.1; then
            echo 'PDF/Pandoc build error log:'
            tail -c 20000 dist/v1.2.1/build_error.log || true
            exit 1
          fi
      - name: Download EPUBCheck 5.4.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output /tmp/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck-5.4.0.zip -d /tmp/
          test -f /tmp/epubcheck-5.4.0/epubcheck.jar
      - name: Run structural checks
        run: |
          python scripts/verify_exports.py --version 1.2.1 --epubcheck-jar /tmp/epubcheck-5.4.0/epubcheck.jar
          python scripts/audit_clean_reader_121.py
          python scripts/audit_project.py
      - name: Package preserved editable source
        run: python scripts/package_release.py --version 1.2.1 --source-bundle
      - name: Preserve reproducible release on same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/v1.2.1
          if ! git diff --cached --quiet; then
            git commit -m "Build and validate clean reader edition 1.2.1"
            git push origin HEAD:edition-1.2.1
          fi
